name: V5.16 Rolling As-Of ETF Allocation rolling

on:
  workflow_dispatch:
    inputs:
      replace_official_target:
        description: "Replace an existing official target for the same month (recovery only)"
        required: false
        default: false
        type: boolean
  schedule:
    # Run after US market close on the 1st of each month.
    # Manual runs also evaluate using the latest available close.
    - cron: "30 22 1 * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: v516-rolling-asof-allocation
  cancel-in-progress: false

jobs:
  run-v516-allocation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check official monthly target guard
        id: target_guard
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.replace_official_target }}" == "true" ]]; then
            EXTRA_ARGS+=(--replace-official-target)
          fi

          python check_v516_monthly_target_guard.py \
            --lock-dir live_targets/v516 \
            --current-month "$(date -u +%Y-%m)" \
            "${EXTRA_ARGS[@]}"

      - name: Report protected same-month skip
        if: steps.target_guard.outputs.should_run != 'true'
        run: |
          echo "No new target was calculated or published. Use the existing locked target and the monitor-only workflow."

      - name: Install dependencies
        if: steps.target_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy yfinance riskfolio-lib openpyxl matplotlib
          fi

      - name: Run production V5.16 Mom126Skip21 allocation
        if: steps.target_guard.outputs.should_run == 'true'
        run: |
          python main_option2_all_etfs_v5_16_rolling_asof_monthly_attribution_dynamic_enddate.py \
            --end-date auto \
            --rebalance-mode rolling_asof_monthly \
            --sma50-eligibility hard \
            --mom63-eligibility hard \
            --short-momentum-score mom126_skip21 \
            --relative-strength-score none \
            --volatility-score total63 \
            --output-dir outputs_option2_v5_16_score_tilted_cvar

      - name: Generate plain-English allocation explanation
        if: steps.target_guard.outputs.should_run == 'true'
        run: |
          python explain_v516_allocation_fixed.py \
            --output-dir outputs_option2_v5_16_score_tilted_cvar \
            --window 2023 \
            --zip

      - name: Get latest rebalance date
        if: steps.target_guard.outputs.should_run == 'true'
        id: latest_rebalance
        run: |
          python .github/scripts/get_latest_rebalance_date.py

      - name: Lock official monthly live target
        if: steps.target_guard.outputs.should_run == 'true'
        id: lock_target
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.replace_official_target }}" == "true" ]]; then
            EXTRA_ARGS+=(--replace-same-month)
          fi

          python lock_v516_monthly_target.py \
            --output-dir outputs_option2_v5_16_score_tilted_cvar \
            --window 2023 \
            --lock-dir live_targets/v516 \
            --official-month "$(date -u +%Y-%m)" \
            --source-commit "${{ github.sha }}" \
            --source-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-artifact "v516-rolling-asof-${{ steps.latest_rebalance.outputs.latest_rebalance_date }}-${{ github.run_number }}" \
            "${EXTRA_ARGS[@]}"

      - name: Upload allocation artifacts
        if: steps.target_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v516-rolling-asof-${{ steps.latest_rebalance.outputs.latest_rebalance_date }}-${{ github.run_number }}
          path: |
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_summary.csv
            outputs_option2_v5_16_score_tilted_cvar/benchmark_comparison_by_window.csv
            outputs_option2_v5_16_score_tilted_cvar/rolling_12m_summary_by_window.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/final_target_weights_tradeable.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/final_allocation_attribution.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/allocation_attribution_by_rebalance.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/final_portfolio_selection_reasons.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/signal_cash_history.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/turnover_by_rebalance.csv
            outputs_option2_v5_16_score_tilted_cvar/walk_forward_windows/2023/benchmark_comparison.csv
            outputs_option2_v5_16_score_tilted_cvar/allocation_explanation_reports/
            live_targets/v516/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit updated allocation outputs
        if: steps.target_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs_option2_v5_16_score_tilted_cvar live_targets/v516 || true

          if git diff --cached --quiet; then
            echo "No allocation output changes to commit."
          else
            git commit -m "Update V5.16 rolling as-of ETF allocation - ${{ steps.latest_rebalance.outputs.latest_rebalance_date }}"
            git pull --rebase
            git push
          fi
