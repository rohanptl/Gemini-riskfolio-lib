name: V5.16 Mid-Month Monitor Only

on:
  workflow_dispatch:
  schedule:
    # Friday after the US close. This job never creates a new target or trades.
    - cron: "30 23 * * 5"

permissions:
  contents: write

concurrency:
  group: v516-midmonth-monitor
  cancel-in-progress: true

jobs:
  monitor-locked-target:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Monitor locked monthly target
        run: |
          python monitor_v516_midmonth.py \
            --lock-dir live_targets/v516 \
            --output-dir outputs_monitor_v516 \
            --as-of auto

      - name: Commit latest monitor reports
        shell: bash
        run: |
          # Fail safely rather than deleting previously committed reports.
          if [ ! -d outputs_monitor_v516 ] || \
             [ -z "$(find outputs_monitor_v516 -type f -print -quit)" ]; then
            echo "::error::No monitor reports were generated"
            exit 1
          fi

          mkdir -p reports/v516-midmonth
          rsync -a --delete outputs_monitor_v516/ reports/v516-midmonth/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/v516-midmonth/

          if git diff --cached --quiet; then
            echo "Monitor reports unchanged; skipping commit"
            exit 0
          fi

          git commit -m "Update V5.16 midmonth monitor reports"
          git push origin HEAD:main
